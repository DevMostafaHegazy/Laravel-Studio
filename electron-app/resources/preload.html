<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;" />
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111214;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Segoe UI', sans-serif;
                color: #9296a1;
            }
            .loader {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
            }
            .mark {
                width: 48px;
                height: 48px;
                border-radius: 14px;
                background: linear-gradient(145deg, #202c48, #151820);
                border: 1px solid rgba(255,255,255,.09);
                box-shadow: 0 18px 50px rgba(0,0,0,.32);
                display: grid;
                place-items: center;
            }
            .mark svg { width: 25px; height: 25px; }
            .bar {
                width: 132px;
                height: 2px;
                background: rgba(255,255,255,.07);
                overflow: hidden;
                border-radius: 99px;
            }
            .bar::after {
                content: '';
                display: block;
                width: 34%;
                height: 100%;
                border-radius: inherit;
                background: #5f9cff;
                animation: load 1.15s cubic-bezier(.65,0,.35,1) infinite;
            }
            @keyframes load {
                from { transform: translateX(-110%); }
                to { transform: translateX(300%); }
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <div class="mark">
                <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                    <path d="M22 15v34h25" stroke="#F5F7FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="46" cy="20" r="4" fill="#69A2FF"/>
                </svg>
            </div>
            <div class="bar"></div>
        </div>
    </body>
</html>
